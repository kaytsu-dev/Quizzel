{% extends "base.html" %}{% block title %}Inizia · Quizzel{% endblock %}{% block content %}
<section class="welcome card"><div class="eyebrow">QUIZ SULLE CAPITALI EUROPEE</div><h1>Come vuoi svolgere il Quiz?</h1><p class="muted">Scegli il tipo di domande. Ogni risposta corretta vale <strong>10 punti</strong>.</p>
<form action="{{ url_for('start') }}" method="post" class="start-form"><label for="username">Il tuo username</label><input id="username" name="username" type="text" maxlength="40" autocomplete="nickname" placeholder="Come ti chiami?" required autofocus>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<div class="mode-buttons"><button class="button primary mode-button" type="submit" name="mode" value="multiple"><span>Risposte multiple</span><small>10 domande a scelta multipla</small></button><button class="button primary mode-button" type="submit" name="mode" value="open"><span>Risposte aperte</span><small>10 domande da completare</small></button><button class="button primary mode-button" type="submit" name="mode" value="mixed"><span>Risposte sia multiple che aperte</span><small>5 domande per ciascun tipo</small></button></div></form></section>{% endblock %}
